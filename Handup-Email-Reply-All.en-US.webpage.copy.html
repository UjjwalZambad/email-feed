<script>

    let originalEmail = null;
    let currentCaseId = null;
    let selectedFiles = [];
    let recipientContactId = null;

            // Example value: jpg,jpeg,png,gif,svg,js,css,zip,doc,docx,xls,xlsx,ppt,pptx,pdf,woff,ttf
        window.caseAttachmentAllowedFileTypesRaw =
            "{{ snippets['CAT Document Upload Allow File Type'] | default: '' }}";

        window.caseAttachmentAllowedMaxFilesRaw =
            "{{ snippets['CAT Webform Upload Allow Max Files'] | default: '5' }}";

        window.caseAttachmentAllowedFileSizeMbRaw =
            "{{ snippets['CAT Webform Upload Allow File Size (MB)'] | default: '25' }}";

        const CASE_ATTACHMENT_MIME_TYPES = {
            jpg: "image/jpeg",
            jpeg: "image/jpeg",
            png: "image/png",
            gif: "image/gif",
            svg: "image/svg+xml",

            js: "text/javascript",
            css: "text/css",

            zip: "application/zip",

            doc: "application/msword",
            docx: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",

            xls: "application/vnd.ms-excel",
            xlsx: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",

            ppt: "application/vnd.ms-powerpoint",
            pptx: "application/vnd.openxmlformats-officedocument.presentationml.presentation",

            pdf: "application/pdf",

            woff: "font/woff",
            ttf: "font/ttf"
        };

        function parsePositiveInteger(value, fallbackValue) {
            const parsed = parseInt(String(value || "").trim(), 10);

            if (isNaN(parsed) || parsed <= 0) {
                return fallbackValue;
            }

            return parsed;
        }

        function buildAllowedExtensionSet(rawValue) {

            return new Set(
                String(rawValue || "")
                    .split(",")
                    .map(x => x.trim().toLowerCase())
                    .filter(Boolean)
            );
        }

        const CASE_ATTACHMENT_ALLOWED_EXT =
            buildAllowedExtensionSet(
                window.caseAttachmentAllowedFileTypesRaw
            );

        const CASE_ATTACHMENT_MAX_FILES_PER_UPLOAD =
            parsePositiveInteger(
                window.caseAttachmentAllowedMaxFilesRaw,
                5
            );

        const CASE_ATTACHMENT_MAX_FILE_SIZE_MB =
            parsePositiveInteger(
                window.caseAttachmentAllowedFileSizeMbRaw,
                25
            );

        const CASE_ATTACHMENT_MAX_FILE_SIZE_BYTES =
            CASE_ATTACHMENT_MAX_FILE_SIZE_MB * 1024 * 1024;

    window.webapi = window.webapi || {};

(function (webapi, $) {

    function safeAjax(ajaxOptions) {

        var deferredAjax = $.Deferred();

        shell.getTokenDeferred().done(function (token) {

            if (!ajaxOptions.headers) {
                ajaxOptions.headers = {};
            }

            ajaxOptions.headers["__RequestVerificationToken"] = token;

            $.ajax(ajaxOptions)
                .done(function (data, textStatus, jqXHR) {
                    deferredAjax.resolve(data, textStatus, jqXHR);
                })
                .fail(function (jqXHR, textStatus, errorThrown) {
                    deferredAjax.reject(jqXHR, textStatus, errorThrown);
                });

        }).fail(function () {
            deferredAjax.rejectWith(this, arguments);
        });

        return deferredAjax.promise();
    }

    webapi.safeAjax = safeAjax;

})(window.webapi, jQuery);

function setParentSendButtonState(disabled) {

    if (
        window.parent &&
        window.parent !== window
    ) {

        const $buttons = window.parent.$(
            "#replyAllSendBtn, #popupSendBtn"
        );

        if ($buttons.length) {

            $buttons.prop("disabled", disabled);

            if (disabled) {

                $buttons.css({
                    opacity: "0.5",
                    cursor: "not-allowed",
                    pointerEvents: "none"
                });

            } else {

                $buttons.css({
                    opacity: "",
                    cursor: "",
                    pointerEvents: ""
                });

            }
        }
    }
}

function validateSelectedFiles(files) {

    const validFiles = [];

    for (const file of files) {

        const extension =
            (file.name.split(".").pop() || "")
            .toLowerCase();

        // Extension validation
        if (
            CASE_ATTACHMENT_ALLOWED_EXT.size > 0 &&
            !CASE_ATTACHMENT_ALLOWED_EXT.has(extension)
        ) {

            showNotification(
                `${file.name} is not an allowed file type.`,
                "error"
            );

            continue;
        }

        // Size validation
        if (
            file.size >
            CASE_ATTACHMENT_MAX_FILE_SIZE_BYTES
        ) {

            showNotification(
                `${file.name} exceeds the maximum size of ${CASE_ATTACHMENT_MAX_FILE_SIZE_MB} MB.`,
                "error"
            );

            continue;
        }

        validFiles.push(file);
    }

    return validFiles;
}

function loadRecipientContact(emailAddress){

    if(!emailAddress){
        return;
    }

    webapi.safeAjax({

        type: "GET",

        url:
            "/_api/contacts" +
            "?$select=contactid,emailaddress1" +
            "&$filter=emailaddress1 eq '" +
            emailAddress +
            "'",

        success: function(result){

            recipientContactId =
                result.value?.[0]?.contactid || null;

            console.log(
                "Recipient Contact ID:",
                recipientContactId
            );
        },

        error: function(xhr){

            console.error(
                "Failed to load recipient contact",
                xhr
            );

        }

    });

}

function loadEmail(emailId){

    $.ajax({

       url:
        "/_api/emails(" +
        emailId +
        ")?$select=activityid,subject,description,createdon,sender,torecipients,_regardingobjectid_value" +
        "&$expand=email_activity_parties($select=participationtypemask,addressused,_partyid_value)",

        method:"GET",

        headers:{
            "Accept":"application/json"
        },

        success:function(email){

            console.log("Email Loaded", email);

            originalEmail = email;

            const recipientEmail =
                (email.torecipients || "")
                    .split(";")[0]
                    .trim();

            loadRecipientContact(recipientEmail);

            renderCompose(email);

            loadEmailAttachments(email.activityid)
        },

        error:function(xhr){

            console.error(xhr);

            $("#replyEmailContainer").html(`
                <div class="error-message">
                    {{ snippets['CAT_Error_EmailFail'] }}
                    <br><br>
                    ${xhr.responseText || ""}
                </div>
            `);

        }

    });

}

function loadEmailAttachments(emailId) {
 
    $.ajax({
        url: "/_api/activitymimeattachments" +
             "?$select=activitymimeattachmentid,filename,mimetype,filesize" +
             "&$filter=_objectid_value eq " + emailId,
        method: "GET",
        headers: { "Accept": "application/json" },
 
        success: function (result) {
            renderExistingAttachments(result.value || []);
        },
 
        error: function (xhr) {
            console.error("Failed to load attachments", xhr.status, xhr.responseText);
        }
    });
}
 
function renderExistingAttachments(items) {
 
    if (!items.length) {
        $("#existingAttachments").empty();
        return;
    }
 
    let html = '<div class="compose-label">Attachments:</div>';
 
    items.forEach(function (a) {
        const sizeKB = a.filesize ? (a.filesize / 1024).toFixed(2) : "";
        html += `
<div class="attachment-row">
<div class="attachment-name">${a.filename || ""}</div>
<div class="attachment-size">${sizeKB} KB</div>
</div>
        `;
    });
 
    $("#existingAttachments").html(html);
}

function triggerSendEmailFlow(emailId) {

    const flowUrl =
        "/_api/cloudflow/v1.0/trigger/150e9a76-0c9a-f111-b8dc-7ced8d6fdee0";

    const cleanId = String(emailId)
        .replace(/[{}]/g, "")
        .trim();

    /*
     * Important:
     * eventData must be a JSON STRING.
     * Do not pass eventData as a nested object.
     */
    const requestPayload = {
       eventData: JSON.stringify({
           emailId: cleanId
    })
    };

    console.log("Flow UR*:", flowUrl);
    console.log("Ema*l ID:", cleanId);
    console.log("Flow request object:", requestPayload);
    console.log(
        "Serialized eventData:",
        requestPayload.eventData
    );

    return webapi.safeAjax({
        type: "POST",
        url: flowUrl,

        /*
         * Let jQuery send requestPayload as form data.
         * This matches Microsoft's Power Pages example.
         */
        data: requestPayload,

        success: function (response, textStatus, jqXHR) {

            console.log("Flow triggered successfully");
            console.log("Status:", jqXHR.status);
            console.log("Response:", response);
        },

        error: function (xhr, textStatus, errorThrown) {

            console.error("Flow trigger failed");
            console.error("Status:", xhr.status);
            console.error("Response:", xhr.responseText);
            console.error("Error:", errorThrown);
        }
    });
}

function createMimeAttachment(file, emailId){

    return new Promise(function(resolve,reject){

        const reader = new FileReader();

        reader.onload = function(e){

            const base64Content =
                e.target.result.split(",")[1];

            const attachmentPayload = {

                objecttypecode: "email",
                subject: file.name,
                filename: file.name,
                mimetype: file.type,
                body: base64Content,
                "objectid_email@odata.bind":
                    "/emails(" + emailId + ")"
            };

            webapi.safeAjax({

                type: "POST",

                url: "/_api/activitymimeattachments",

                contentType: "application/json",

                data: JSON.stringify(
                    attachmentPayload
                ),

                success: function(){

                    resolve();

                },

                error: function(xhr){

                    reject(xhr);

                }

            });

        };

        reader.readAsDataURL(file);

    });

}

$(document).on(
    "change",
    "#attachmentInput",
    function () {

        let newFiles = Array.from(this.files);

        // Validate extension and file size
        newFiles = validateSelectedFiles(newFiles);

        if (!newFiles.length) {
            this.value = "";
            return;
        }

        // Validate total number of files
        const totalFiles =
            selectedFiles.length +
            newFiles.length;

        if (
            totalFiles >
            CASE_ATTACHMENT_MAX_FILES_PER_UPLOAD
        ) {

            showNotification(
                `Maximum ${CASE_ATTACHMENT_MAX_FILES_PER_UPLOAD} files can be uploaded.`,
                "error"
            );

            this.value = "";
            return;
        }

        selectedFiles.push(...newFiles);

        renderAttachments();

        showUploadPopup(newFiles);;

        this.value = "";
    }
);

$(document).on(
    "click",
    ".remove-attachment",
    function(){

        const index = $(this).data("index");

        selectedFiles.splice(index, 1);

        renderAttachments();

    }
);

    if (
        window.parent &&
        window.parent !== window
    ) {

        const $buttons =
            window.parent.$(
                "#replyAllSendBtn, #popupSendBtn"
            );

        if ($buttons.prop("disabled")) {
            return;
        }
    }

    const replyHtml =
        $("#replyEditor").html();

    const text =

    if(!text){

};
